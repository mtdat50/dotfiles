general {
    lock_cmd = pidof hyprlock || hyprlock       # avoid starting multiple hyprlock instances.
    before_sleep_cmd = loginctl lock-session; killall waybar    # lock before suspend.
    after_sleep_cmd = hyprctl dispatch dpms on; uwsm app waybar &  # to avoid having to press a key twice to turn on the display.
}

listener {
    timeout = 180                                # 3mins
    on-timeout = brightnessctl -s set 10         # set monitor backlight to minimum, avoid 0 on OLED monitor.
    on-resume = brightnessctl -r                 # monitor backlight restore.
}

listener {
    timeout = 300
    on-timeout = loginctl lock-session && hyprctl dispatch dpms off # screen off and lock
    on-resume = hyprctl dispatch dpms on #&& brightnessctl -r          # screen on when activity is detected after timeout has fired.
}

listener {
    timeout = 600
    on-timeout = systemctl suspend                # suspend pc
}
